spring:
  application:
    name: blaze-event-hub
  config:
    import: "optional:file:.env[.properties]"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${BEH_DB_URL:jdbc:h2:file:./data/blazeeventhub-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    # Sem driver-class-name hardcoded: Spring Boot infere do JDBC URL (jdbc:h2 ->
    # H2, jdbc:postgresql -> PG). Hardcodar org.h2.Driver aqui fazia o boot
    # falhar quando BEH_DB_URL apontava pro Supabase (deploy Render
    # update_failed em 2026-08-12). Os testes PG mascaravam o bug porque
    # PostgresStoreIntegrationTests sobrescreve o driver via DynamicPropertySource.
    username: ${BEH_DB_USER:sa}
    password: ${BEH_DB_PASSWORD:}
  sql:
    init:
      mode: always

server:
  # Render injects PORT (e.g. 10000) into Docker containers; SERVER_PORT wins
  # when set explicitly (local dev, custom deploys). Nested placeholder on purpose.
  port: ${SERVER_PORT:${PORT:8080}}
  # Graceful shutdown: Render sends SIGTERM on deploy; without this, in-flight
  # requests (including 10s Blaze API calls and JDBC writes) are cut mid-flight.
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

beh:
  security:
    api-key: ${BEH_API_KEY:dev-local-key}
    rate-limit-per-minute: ${BEH_RATE_LIMIT_PER_MINUTE:30}
  blaze:
    client-id: ${BLAZE_CLIENT_ID:}
    client-secret: ${BLAZE_CLIENT_SECRET:}
    redirect-uri: ${BLAZE_REDIRECT_URI:http://localhost:8080/api/blaze/oauth/callback}
    auth-base-url: ${BLAZE_AUTH_BASE_URL:https://blaze.stream}
    api-base-url: ${BLAZE_API_BASE_URL:https://api.blaze.stream}
    socket-url: ${BLAZE_SOCKET_URL:https://blaze.stream}
    socket-path: ${BLAZE_SOCKET_PATH:/ws}
    scopes: ${BLAZE_SCOPES:users.read,offline.access}
    monitored-channel-id: ${BLAZE_MONITORED_CHANNEL_ID:}
